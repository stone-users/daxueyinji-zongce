<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- empty-folder: open folder with blank papers and a pencil -->
  <rect width="400" height="300" fill="none"/>
  <ellipse cx="200" cy="160" rx="160" ry="105" fill="#2E5A87" opacity="0.06"/>
  <!-- papers floating out -->
  <g transform="rotate(-10 150 90)">
    <rect x="118" y="46" width="76" height="96" rx="6" fill="#FFFFFF" stroke="#E3DCCB" stroke-width="3"/>
    <rect x="132" y="66" width="48" height="6" rx="3" fill="#A9B2BC" opacity="0.5"/>
    <rect x="132" y="80" width="36" height="6" rx="3" fill="#A9B2BC" opacity="0.35"/>
  </g>
  <g transform="rotate(8 260 84)">
    <rect x="222" y="40" width="76" height="96" rx="6" fill="#FFFFFF" stroke="#E3DCCB" stroke-width="3"/>
    <rect x="236" y="60" width="48" height="6" rx="3" fill="#A9B2BC" opacity="0.5"/>
    <rect x="236" y="74" width="30" height="6" rx="3" fill="#A9B2BC" opacity="0.35"/>
  </g>
  <!-- folder back -->
  <path d="M 84 128 a 10 10 0 0 1 10 -10 h 62 l 18 18 h 132 a 10 10 0 0 1 10 10 v 92 a 12 12 0 0 1 -12 12 H 96 a 12 12 0 0 1 -12 -12 z" fill="#F4EEE3" stroke="#E3DCCB" stroke-width="3"/>
  <!-- folder front flap -->
  <path d="M 84 162 h 232 v 76 a 12 12 0 0 1 -12 12 H 96 a 12 12 0 0 1 -12 -12 z" fill="#FAF7F1" stroke="#E3DCCB" stroke-width="3"/>
  <!-- pencil -->
  <g transform="rotate(24 310 210)">
    <rect x="300" y="150" width="18" height="88" rx="4" fill="#C08051"/>
    <polygon points="300,238 318,238 309,262" fill="#F4EEE3"/>
    <polygon points="305,246 313,246 309,260" fill="#22303E"/>
    <rect x="300" y="150" width="18" height="10" rx="4" fill="#B06B7D"/>
  </g>
</svg>
