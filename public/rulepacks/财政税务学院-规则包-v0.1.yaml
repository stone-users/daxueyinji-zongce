# =============================================================================
# 中央财经大学 · 财政税务学院 综测规则包
# =============================================================================
# 复用保险学院 v0.2 schema + 金融学院扩展（anchor_tiers/route_to/range_score/derived）
# 本院特点：
#   [特点1] 学科竞赛、科研项目上限明确写死（各75分），问卷无需再问上限
#   [特点2] 德育基本指标内嵌"基础分+加减"（如政治思想基础分15分起加减）
#   [特点3] 体育赛事/文艺竞赛有"认定项数上限"（校院社团最多3项/2项）
#   [特点4] 线上竞答单独规则（未获奖不加分；获奖6/4/2且最多两项）
# =============================================================================

meta:
  university: 中央财经大学
  college: 财政税务学院
  version: "0.2"
  review_status: reviewed         # ✅ 2026-09-04 双人交叉校对通过
  source_doc: 财政税务学院全日制本科学生素质评价细则-2025.08（适用于2024-2025学年，2025年8月4日启用）
  extracted: 2026-09-04
  reviewers: [梁育豪, 张育豪]
  applicability_warning: 本办法明确标注适用于2024-2025学年；用于后续学年前须确认是否有新版

global_rules:
  eval_period: 学年制（二、三、四学年开学时评上一学年；大四下只评第七学期；第八学期四年总评）
  common_constraints:
    - 人证不能作为证明材料；奖学金、助学金不作为加分证明材料
    - 材料造假：除德育扣分外，该单项成绩记零分，取消素质评价奖学金评定资格、取消推免资格
    - 活动是否加分有争议的，由辅导员和班级评议小组决定，再报学院领导小组
  review_flow: 学生自评 → 班级评议（评议小组占班级20%-30%，公示≥1天）→ 辅导员评议 → 公示≥3天 → 本人签字确认
  rank_levels: [国家级, 省部级, 市地区级, 校级, 院级]

modules:
  # =========================================================================
  # 德育（满分100 = 基本分80 + 奖励分 - 处罚分）
  # =========================================================================
  - id: deyu
    name: 德育评价
    max_score: 100
    formula: 基本分(80) + 奖励分 - 处罚分
    sections:
      - id: deyu_jiben
        name: 德育基本分（80分）
        type: anchor_tiers
        note: 本院特色——部分指标在档位基础上内嵌"基础分+加减分"，以班干部/辅导员提供资料为准
        items:
          - name: 政治思想
            max: 20
            tiers: {优: [16,20], 良: [12,16], 合格: [0,12]}
            anchor: '优=坚定共产主义信仰发挥模范作用；良=坚定理想信念、积极向党组织靠拢；合格=无反动言行、三观正确'
            embedded_adjust:      # 本院特色：基础分15起加减
              base: 15
              bonus:
                - {name: 年满18周岁提交入党申请书, score: 1}
                - {name: 上一学期获得"推优入党", score: 2}
                - {name: 成为党的发展对象/预备党员/党员, score: 2}
              evidence: [各团支书、组织委员提供]
              note: 以当学年情况为加分依据
          - name: 学习态度
            max: 15
            tiers: {优: [12,15], 良: [9,12], 合格: [0,9]}
            embedded_adjust:
              penalty:
                - {name: 旷课/迟到/早退, score: [-2, -1]}
                - {name: 有挂科记录, score: [-2, -1]}
                - {name: 考试违纪/学术不端, score: null, severity: zero_item, note: 本项0分}
              evidence: [各班学习委员提供]
          - name: 道德品质
            max: 15
            tiers: {优: [12,15], 良: [9,12], 合格: [0,9]}
          - name: 法纪观念
            max: 10
            tiers: {优: [8,10], 良: [6,8], 合格: [0,6]}
            embedded_adjust:
              penalty:
                - {name: 违反校规校纪, score: null, severity: zero_item, note: 本项0分}
                - {name: 无故未按时注册报到, score: -1, unit: 分/次}
              evidence: [学院提供名单]
          - name: 集体意识
            max: 10
            tiers: {优: [8,10], 良: [6,8], 合格: [0,6]}
            embedded_adjust:
              penalty:
                - {name: 多次不参与班级活动, score: [-4, -1], note: 班级评议小组酌情}
          - name: 生活修养
            max: 10
            tiers: {优: [8,10], 良: [6,8], 合格: [0,6]}

      - id: deyu_jiangli
        name: 德育奖励分
        system_node: 德育加分
        items:
          - name: 获通报表扬
            type: bonus
            multi_count:
              - {label: 校级, score: 5}
              - {label: 院级, score: 3}
            evidence: [盖章或官方报道证明]
            rule: 同一事件取高不累加
          - {name: 校级优秀宿舍（宿舍长）, score: 5, role: 宿舍长}
          - {name: 校级优秀宿舍（成员）, score: 4, role: 宿舍成员}
          - {name: 校级特色示范宿舍（宿舍长）, score: 3, role: 宿舍长}
          - {name: 校级特色示范宿舍（成员）, score: 2, role: 宿舍成员}
          - name: 军训个人荣誉
            tiers: {优秀学员: 3, 宣传标兵/训练标兵: 2, 参与军训期间比赛或学院工作: 1}
            rule: 多项荣誉取高不累加
          - {name: 无偿献血/骨髓捐赠, score: 3, unit: 分/次, evidence: [校医院名单或献血证明]}
          - {name: 拾金不昧/见义勇为, score: 3, unit: 分/次, evidence: [公安机关文件或媒体报道]}
          - {name: 校级班集体荣誉（班委/团支委/党支委）, score: [2, 3], role: 班委/团支委/党支委, rule: 可累加, examples: [双优班集体, 五四红旗团支部, 校级优秀党支部, 建家"十佳班集体"/"优秀班集体"]}
          - {name: 校级班集体荣誉（成员）, score: 1, role: 成员}
          - {name: 基础团校优秀学员, score: 2}
          - {name: 优秀团员/优秀共产党员/三好学生（市级）, score: 5, rule: 取高不累加}
          - {name: 优秀团员/优秀共产党员/三好学生（校级）, score: 3, note: '"芮+"导师加分按校团委文件为准'}

      - id: deyu_chufa
        name: 德育处罚分
        system_node: 德育减分
        note: 资料由团支书/班长/学委/生活委员/体委/辅导员提供；问卷仅提示不采集
        items:
          - {name: 怂恿或煽动他人违纪, score: -3, unit: 分/次}
          - {name: 受通报批评或公开批评, score: -3, unit: 分/次}
          - {name: 受违纪处分（学院）, score: -3, unit: 分/次}
          - {name: 受违纪处分（学校）, score: -5, unit: 分/次}
          - {name: 卫生不合格宿舍（宿舍长）, score: -3}
          - {name: 卫生不合格宿舍（成员）, score: -2}
          - {name: 参与非法组织活动, score: -3, unit: 分/次}
          - {name: 散播不良言论/污蔑侮辱诽谤他人, score: -2, unit: 分/次}
          - {name: 违背学术道德剽窃成果, score: -8, unit: 分/次}

  # =========================================================================
  # 智育（满分100 = 学习成绩×90% + 人文素质×10%）
  # =========================================================================
  - id: zhiyu
    name: 智育评价
    max_score: 100
    formula: 学习成绩×0.9 + 人文素质培养情况×0.1
    sections:
      - id: zhiyu_chengji
        name: 学习成绩
        items:
          - {name: 学分加权平均分, type: external_input, formula: Σ(成绩×学分)÷Σ学分（不含任选课）, evidence: [学院统一提供成绩]}
      - id: zhiyu_renwu
        name: 人文素质培养情况（100分）
        sections:
          - id: tongshi
            name: 通识课程选修（60分）
            items:
              - name: 通识课门类得分
                type: tiered
                tiers: {不少于两个组类: 40, 每多一类: '+10', 上限: 60}
                grade_note: 大一年级如无通识选修课此项不加分
          - id: dushu
            name: 书籍阅读情况（40分）
            items:
              - {name: 阅读习惯, score: 20, requirement: 每学期3本课外书+至少一本详细读书笔记或书评, evidence: [手写或电子版读书笔记/书评，以及原创证明或查重检验证明]}
              - {name: 学科覆盖, score: 10, evidence: [阅读书目书单或图书馆借阅单]}
              - {name: 读书活动参与, score: 10, note: 校、院组织的读书会/书评会/荐书/评书}
            note: 加分材料由班级评议小组审核；课程作业不计入

  # =========================================================================
  # 体质健康与锻炼（满分100）
  # =========================================================================
  - id: tiyu
    name: 体质健康与锻炼
    max_score: 100
    sections:
      - id: richang_duanlian
        name: 日常体育锻炼
        items:
          - {name: 锻炼频率, type: tiered, tiers: {每天1小时及以上: 40, 每周3次及以上: 30, 每周2次: 20, 每周少于2次: 10}}
      - id: tizhi_ceshi
        name: 体质与健康测试
        items:
          - {name: 体测成绩, type: tiered, tiers: {良好及以上（两学期体育成绩均≥80）: 15, 合格（两学期均≥60）: 10}}
      - id: tiyu_jiben
        name: 体育活动基本分（20分，所有同学均加）
        items:
          - {name: 报名参赛意识, type: base, score: 10, default: true}
          - {name: 坚持一项体育运动, type: base, score: 10, default: true}
      - id: tiyu_jingsai
        name: 体育赛事加分
        matrix:
          国家级:   {参加: 10, 获奖: [8, 10]}
          省部级:   {参加: 8,  获奖: [6, 8]}
          市地区级: {参加: 6,  获奖: [6, 8]}
          校级:     {参加: 5,  获奖: [3, 5]}
          院级:     {参加: 4,  获奖: [2, 4]}
        award_rank_map: {第1名: 一等奖, 第2-4名: 二等奖, 第5-8名: 三等奖}   # 本院特色：获奖前8名均可加分
        participation_cap: 3   # 校、院、社团组织的体育活动，每人最多认证3项
        unawarded_rule: 未获奖均按参加院级活动标准加分
        online_rule: 非线下参与的体育活动按院级标准加分，且仅认定一项
        rule: 同类活动取高不累加
        evidence: [班级体育委员、本人提供]

  # =========================================================================
  # 学术科研与创新（满分200）
  # =========================================================================
  - id: xueshu
    name: 学术科研与创新
    max_score: 200
    sections:
      - id: xueshu_jiben
        name: 基本分（50分，5×10）
        items:
          - {name: 撰写课程论文, type: base, score: 10}
          - {name: 学术研讨/交流/科研团队, type: base, score: 10}
          - {name: 社会调查研究, type: base, score: 10}
          - {name: 科技创新与创业训练实践, type: base, score: 10}
          - {name: 自主学习与能力提高, type: base, score: 10}
      - id: xueke_jingsai
        name: 学科竞赛
        cap: 75                      # [特点1] 上限写死
        matrix:
          国家级:   {参加: 15, 获奖: [15, 17]}
          省部级:   {参加: 12, 获奖: [13, 15]}
          市地区级: {参加: 10, 获奖: [10, 12]}
          校级:     {参加: 8,  获奖: [8, 10]}
          院级:     {参加: 6,  获奖: [6, 8]}
        level_determination: 按获奖证明材料中的主办方级别归类
        team_rule:
          type: derived
          rule: 队长按标准加分；队员在国家级/省部级/市地区级减4分，校级/院级减2分；参加分和获奖分做相同处理
        scope_rules:
          - 校、院组织的学科竞赛：参加未获奖按参加校级比赛加分，需提供参赛作品
          - 校、院之外其他机构组织的竞赛：每人最多认定两项竞赛加分；未获奖按参加校级比赛加分，需提供参赛作品
          - 不同竞赛获奖可累计；同类竞赛不同等级取高不累加
      - id: keyan_xiangmu
        name: 科研与创新创业项目
        cap: 75                      # [特点1] 上限写死
        matrix:
          参加: {国家级: 15, 省部级: 12, 市地区级: 10, 校级: 8, 院级: 6}
          立项: {国家级: 17, 省部级: 15, 市地区级: 12, 校级: 10, 院级: 8}   # 在参加基础上累加
          结项: {国家级: 15, 省部级: 12, 市地区级: 10, 校级: 8, 院级: 6}
        team_rule:
          type: derived
          rule: 队长按标准加分；队员在国家级/省部级/市地区级减2分，校级/院级减1分；参加分和立项分做相同处理
        excellent_bonus: {结项成果为"优秀": {队长: 5, 队员: 3}}   # 在结项分基础上加
        rules:
          - 本年度立项后按标准加分；结项年度通过验收结项按结项标准加分，不再在参加基础上累加
      - id: fabiao_wenzhang
        name: 发表学术文章
        exclusions: [摘抄, 新闻简讯]
        matrix:
          公开出版学术著作:        [30, 25, 20, 15]
          SCI_SSCI_EI_ISTP检索期刊: [30, 25, 20, 15]
          国内核心期刊:           [20, 16, 14, 10]   # 以央财《中文核心期刊目录》为准
          公开发行的学术刊物:      [15, 13, 10, 8]
          公开出版的学术论文集:     [12, 10, 8, 6]
          校内学术刊物:           [8, 6, 4, 2]
        extra:
          - {name: 文章入选学术会议及论坛, score: [10, 15], unit: 分/篇}
        rules: [出版不同著作可累计, 不同论文按篇数累计, 需有出版刊物或录用证明]
      - id: xueshu_rongyu
        name: 学术科研与创新类荣誉称号
        items:
          - {name: 中央财经大学学术科研先进个人, score: 8}
          - {name: 中央财经大学学术科研十杰, score: 10}

  # =========================================================================
  # 组织管理能力（满分100）
  # =========================================================================
  - id: zuzhi
    name: 组织管理能力
    max_score: 100
    sections:
      - id: zuzhi_jiben
        name: 基本分（20分）
        tiers:
          在校/院/社团各级组织担任职务: 20
          其余同学: 15
        items:
          - {name: 责任感与组织任务承担, score: 10, type: base}
          - {name: 活动策划组织协调, score: 5, type: base}
          - {name: 勤勉履职, score: 5, type: base}
      - id: zuzhi_yeji
        name: 业绩能力分（70分）
        type: external_input
        note: 学院统一提供组织能力得分；一学年满分70，一学期满分35；工作时间一学期得分减半
        assessment_ratios:
          校级学生组织: {优: 40%, 良: 50%, 合格: 10%, 考核部门: 校团委或所属职能部门}
          院级学生组织: {优: 40%, 良: 50%, 合格: 10%, 考核部门: 学院分团委}
          班级学生组织: {优: 40%, 良: 50%, 合格: 10%, 考核部门: 辅导员、所在班级学生}
          其他部门: {优: 30%, 良: 60%, 合格: 10%, 考核部门: 对应管理部门}
        score_bands: {优: [60,70], 良: [40,60], 合格: [0,40]}
        extra: [党支委由党支部书记统一评分]
      - id: zuzhi_jiafen
        name: 加分
        rule: 取高不累加；校学生部门、社团组织内部评选的荣誉不在此项加分
        items:
          - {name: 国家级优秀学生干部, score: 15}
          - {name: 省部级优秀学生干部, score: 12}
          - {name: 校十佳学生干部, score: 8}
          - {name: 校优秀学生干部, score: 5}
          - {name: 学院优秀学生干部, score: 3}

  # =========================================================================
  # 劳动实践评价（满分100）
  # =========================================================================
  - id: laodong
    name: 劳动实践评价
    max_score: 100
    sections:
      - id: laodong_jiben
        name: 基本分（40分，4×10）
        items:
          - {name: 劳动观念与劳动教育课程, type: base, score: 10}
          - {name: 社会实践与报告获认可, type: base, score: 10, evidence: [实践报告]}
          - {name: 志愿服务与公益意识, type: base, score: 10, evidence: [志愿服务证明]}
          - {name: 实习实践/创业项目, type: base, score: 10, evidence: [带章实习证明或其他有效佐证]}
      - id: laodong_jiafen
        name: 加分
        system_node: 加分
        items:
          - {name: 志愿服务时长, rate: 0.2分/小时, cap: 10, evidence: [校团委和学生所在单位认证]}
          - {name: 志愿服务社会公益荣誉称号, score: [3, 5], rule: 同类取高不累加}
          - {name: 社会实践报告/调查报告获奖, score_range_by_level: {国家级: [20,22], 省部级: [18,20], 市区级: [16,18], 校级: [12,16], 院级: [8,12]}}
          - {name: 社会实践团队立项, score_range_by_level: {负责人: {国家级: [20,22], 省部级: [16,18], 市区级: [14,16], 校级: [10,14], 院级: [8,10]}, 成员: {国家级: [16,18], 省部级: [12,14], 市区级: [10,12], 校级: [8,12], 院级: [6,8]}}}
          - {name: 社会实践团队获奖, score_range_by_level: {负责人: {国家级: [20,22], 省部级: [16,18], 市区级: [14,16], 校级: [10,14], 院级: [8,10]}, 成员: {国家级: [16,18], 省部级: [12,14], 市区级: [10,12], 校级: [8,12], 院级: [6,8]}}}
          - {name: 实习实践受服务单位表彰, score: [10, 15], note: 只限课余自行/组队参与的实习实践，非学校安排或立项}
          - {name: 创业实践项目获立项资助, score_by_level: {国家级: 22, 省部级: 18, 市区级: 16, 校级: 12, 院级: 10}}
          - {name: 先进个人、十佳等, score_by_level: {国家级: 12, 省部级: 10, 市区级: 8, 校级: 6, 院级: 4}}
        rule: 同一项目多项奖励取高不累加

  # =========================================================================
  # 美育素养评价（满分100）
  # =========================================================================
  - id: meiyu
    name: 美育素养评价
    max_score: 100
    sections:
      - id: meiyu_jiben
        name: 基本分（30分）
        items:
          - {name: 参加文化活动, type: base, score: 5}
          - {name: 校园文化合理化建议被采纳, type: base, score: 5}
          - {name: 艺术特长和文艺兴趣, type: base, score: 5}
          - {name: 参与文化艺术活动或社团, type: base, score: 5}
          - {name: 文艺知识与审美能力, type: base, score: 10}
      - id: meiyu_jingsai
        name: 文化、艺术类竞赛
        matrix:
          国家级:   {参加: 20, 获奖: [15, 20]}
          省部级:   {参加: 15, 获奖: [10, 15]}
          市地区级: {参加: 12, 获奖: [8, 10]}
          校级:     {参加: 10, 获奖: [8, 10]}
          院级:     {参加: 6,  获奖: [6, 8]}
        rule: 同类比赛取高不累加
        participation_cap: 2   # [特点3] 校、院、社团线下组织的竞赛每人最多认定2项
        online_quiz_rule:      # [特点4] 线上知识竞答单列
          未获奖: 不加分
          获奖: {一等奖: 6, 二等奖: 4, 三等奖: 2}   # 不含优秀奖；不叠加参加分
          cap: 2
        online_other_rule: 线上其他类别竞赛按校级或院级认定加分
        art_troupe_exemption: 校艺术团成员参加学校组织的集体型大型活动表演按项目算参加分，不受2项上限影响
      - id: meiyu_fabiao
        name: 发表文学、艺术类作品
        matrix:
          公开出版文学艺术著作:   [30, 25, 20, 15]
          国家级权威报刊媒体:     [20, 15, 12, 10]
          省级重要报刊媒体:       [10, 8, 6, 5]
          其他公开发行报刊媒体:   [5, 4, 3, 2]
          校内报刊:              [3, 2, 1, 0.5]
        extra:
          - {name: 个人画展/摄影展/个人演出, score: 8, unit: 分/次}
          - {name: 网络媒体公开发表个人文艺作品, score: 2, unit: 分/篇, cap: 6}   # 本院特色
        rules:
          - 省级以上报刊文学作品≥2000字；校内及其他刊物≥1000字；须有刊物或录用证明
          - 同一作品不同刊物发表/转载取高不累加

