total_formula:
  基本素质评价成绩: 德育×30% + 智育×60% + 体育锻炼×10%
  综合素质评价总成绩: 基本素质评价成绩 + 学术科研与创新×10% + 组织管理能力×10% + 劳动实践×10% + 美育×10%
  用途: 总成绩为综测全面发展奖学金评价标准；用于评奖评优、保研、就业推荐
  rank_formula: null   # ⚠️ 本院细则未规定排名成绩公式，待与学院确认是否同学校通用机制

