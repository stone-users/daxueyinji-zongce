# =============================================================================
# 中央财经大学 · 保险学院 课外活动等级目录（子配置）
# =============================================================================
# 被主规则包 保险学院-规则包-v0.1.yaml 引用，用于回答"这个活动算哪一级？"
# 来源：保险学院课外活动等级认定办法（202403修改后正式版）.pdf
# 注意：清单为"不完全列举"，未收录活动按 principles 兜底认定，原则上不超过校级
# =============================================================================

meta:
  college: 保险学院
  version: "0.1"
  review_status: reviewed
  reviewers: [梁育豪, 张育豪]
  source_doc: 保险学院课外活动等级认定办法（2024年3月修订）
  effective_from: 2023-09-01
  scope: 学科竞赛、学术会议、社会实践等课外活动；文体类、美育类活动适用同一基本原则
  exclusions: 已发表学术论文、在研课题（含大创）不适用本办法，按学校科研成果/课题等级划分

# ---------------------------------------------------------------------------
# 兜底原则：清单之外的活动如何定级
# ---------------------------------------------------------------------------
principles:
  core: 以主办方（非承办方）"代表谁"行使职能为认定基础，结合参与者范围、影响力、获奖难度综合判断
  national: 国家级行政管理部门及其委托的教指委、全国性专业学会/学术团体/行业协会主办；或国际一级组织主办且有公认权威性的，视同国家级
  provincial: 省级政府部门及其委托机构、省级学术团体/行业协会、全国性学会省级分会主办；国家级竞赛的省级区域赛；国际二级组织（如美国大学生数学建模竞赛）视同省级
  municipal: 市级政府部门、市级学术团体/行业协会、全国性学会市级分会主办；国家级比赛的市级区域赛
  school: 高校或其职能部门主办、国内外企业主办（少数影响力大的企业品牌活动经委员会讨论可上调）
  college: 高校院系或学生社团主办；外校院系/社团主办的，证明材料需盖章方可认定
  fallback: 清单之外且未经过学校选拔的活动，原则上等级认定不得超过校级；疑难项报学院等级认定工作委员会
  award_mapping:
    - 特等奖 → 一等奖
    - 一等奖 → 一等奖
    - 二等奖 → 二等奖
    - 三等奖 → 三等奖
    - 优秀奖/优胜奖 → 仅算"参加"，不算获奖
  art_sports_rule: 文体/美育类活动经学校选拔参加的按相应级别认定；未经过学校选拔的原则上不超过校级

# ---------------------------------------------------------------------------
# 等级清单（可定期调整，引擎按名称匹配，匹配不到走 fallback）
# ---------------------------------------------------------------------------
