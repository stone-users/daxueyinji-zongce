# ---------------------------------------------------------------------------
# 争议处理
# ---------------------------------------------------------------------------
dispute:
  committee: 保险学院本科生课外活动等级认定工作委员会
  composition: [主管学生工作副书记, 主管本科教务副院长, 系主任, 本科教学管理办公室负责人, 本科生辅导员]
  process: 清单外活动结合认定原则单独认定 → 仍难以确定的由委员会商议 → 决议后可调整清单
