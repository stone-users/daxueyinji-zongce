# =============================================================================
# 中央财经大学 · 金融学院 综测规则包
# =============================================================================
# 模板说明：本文件复用保险学院 v0.2 的 schema，并因金融学院细则倒逼出以下扩展：
#   [扩展A] multi_party      多方加权打分（德育基本分=自评40%+评议30%+辅导员30%）
#   [扩展B] anchor_tiers     优/良/合格 锚定档位（带行为描述的自评档位）
#   [扩展C] route_to         系统内无对应节点 → 计入"其他"项并写得分说明
#   [扩展D] range_score      区间分值（如 8-10 分），需评议小组定夺
#   [扩展E] derived          派生分（成员分=负责人分-2 之类的计算规则）
# 校对状态：draft，待梁育豪/张育豪双人校对
# =============================================================================

meta:
  university: 中央财经大学
  college: 金融学院
  version: "0.2"
  review_status: reviewed         # ✅ 2026-09-04 双人交叉校对通过
  source_doc: 金融学院全日制本科生综合素质评价细则.docx（2024年8月1日）
  extracted: 2026-09-04
  reviewers: [梁育豪, 张育豪]
  linked_configs: []              # ⚠️ 缺《金融学院本科学生素质评价评分证明材料详解》，见 pending_review
  eval_period:
    常规年级: 前一年9月1日（含）至当年8月31日（含）
    大四下学期: 前一年9月1日（含）至当年发布素质评价通知之日（含）

# ---------------------------------------------------------------------------
# 全局口径
# ---------------------------------------------------------------------------
global_rules:
  common_constraints:
    - 证明材料落款时间须在评价时间范围内；提交与事实不符的材料取消该项加分资格
    - 人证不能作为证明材料
    - 班级/学院活动结束后由负责人公示名单，学生一周内确认，过期无效；最终签字名单需提交学院
    - 奖学金、助学金不作为加分证明材料
    - 社会商业项目不作为加分证明材料
    - 除奖状照片外，一切合照不允许作为证明材料
    - 学院认可的活动名单、实践报告、公开报道（学院/学校官微、媒体报道）可作为证明材料
    - 所有参与项加分均指参与完全部过程，只报名不参与取消参与项加分
  review_flow: 学生自评 → 班级评议（评议小组原则上单向向下减分）→ 辅导员评价 → 公示
  self_eval_rules:
    - 自评阶段未申请加分的项目、未申报的材料，除不可抗力外不允许补充
    - 虚假报送：全院通报批评+扣分+取消大学期间一切评奖评优、保研、入党资格
  adjustment_rule: 评议调整不得删除条目，改分须在备注记载：评议人姓名、操作、x分改为y分、原因
  rank_levels: [国家级, 省部级, 市地区级, 校级, 院级]

# =============================================================================
# 模块一：德育评价（满分100 = 基本分80 + 奖励分[上限30] - 处罚分）
# =============================================================================
modules:
  - id: deyu
    name: 德育评价
    max_score: 100
    formula: 基本分(满分80) + 奖励分(上限30) - 处罚分；奖励分>20且与基本分总和超100时，调低基本分使总和=100，再减处罚分
    sections:

      # ---- 基本分：多方加权，非问卷可自动算 ----
      - id: deyu_jiben
        name: 德育基本分（80分）
        type: multi_party                     # [扩展A]
        weights: {学生自评: 0.4, 评议小组: 0.3, 辅导员: 0.3}
        constraint: 评议小组评价得分不高于学生自评得分
        note: 自评阶段需先联系辅导员完成辅导员评价分，班级建excel按权重算最终基本分，再在系统"生活修养"项中调整使六项总分与excel一致（excel留存备查）
        items:
          - {name: 政治思想, max: 20, tiers: {优: [16,20], 良: [12,16], 合格: [0,12]}, anchor: '优=坚定共产主义信仰发挥先锋模范作用；良=坚定理想信念、积极向党组织靠拢、参加主题教育活动；合格=无反动言行、三观正确'}
          - {name: 学习态度, max: 15, tiers: {优: [12,15], 良: [9,12], 合格: [0,9]}, anchor: '优=热爱学习锐意创新、带动同学；良=完成教学计划、参加讲座学术活动；合格=无旷课迟到早退、无学术不诚信'}
          - {name: 道德品质, max: 15, tiers: {优: [12,15], 良: [9,12], 合格: [0,9]}, anchor: '优=踊跃参加人文素养活动、为精神文明做贡献；良=谦谨明礼诚实守信；合格=诚实不失信、遵守公共文明'}
          - {name: 法纪观念, max: 10, tiers: {优: [8,10], 良: [6,8], 合格: [0,6]}, anchor: '优=发挥遵纪守法模范作用；良=参加法规宣传、依规履行义务；合格=不违法不违纪'}
          - {name: 集体意识, max: 10, tiers: {优: [8,10], 良: [6,8], 合格: [0,6]}, anchor: '优=为集体建设作突出贡献；良=承担班级公益性工作、积极参加活动；合格=无破坏团结言行'}
          - {name: 生活修养, max: 10, tiers: {优: [8,10], 良: [6,8], 合格: [0,6]}, anchor: '优=明礼修身甘为表率；良=生活习惯良好、参加义务劳动；合格=无不文明举止、不影响他人作息'}

      # ---- 奖励分（上限30）：大量条目系统无对应节点 → route_to 其他 ----
      - id: deyu_jiangli
        name: 德育奖励分
        cap: 30
        items:
          - name: 获通报表扬
            type: bonus
            multi_count:
              - {label: 校级, score: 5}
              - {label: 院级, score: 3}
            evidence: [校级媒体/宣传部门新闻稿或公开发文, 院级媒体/宣传部门新闻稿或公开发文]
            rule: 同类事件取高不累加
            source_quote: "获通报表扬：校级+5分，院级+3分"
          - name: 卫生优秀宿舍
            type: derived                        # [扩展E] 折算复杂，引擎只做计算器
            formula_note: >
              无检查数据时统一按宿舍长+5/成员+4；有寝室卫生检查数据时：
              每次优秀=5÷次数，良好=3÷次数，合格=2÷次数，不合格=0；各项加和为宿舍长得分（≤5）；
              宿舍成员=宿舍长得分×0.8。
            source_quote: "卫生优秀宿舍：宿舍长+5分，成员+4分（详细折算见细则第十四条）"
          - {name: 军训标兵/优秀学员/先进个人, score: 2, rule: 多项荣誉取高不累加, extra: 所在组织获模范班集体则该项统一+1, source_quote: "军训期间获训练标兵称号、优秀学员或先进个人称号+2分"}
          - {name: 骨髓捐赠等, score: 3, unit: 分/次, evidence: [相关证明]}
          - {name: 军训模范班集体（负责人）, score: 3, role: 负责人, note: 此项在德育加，不在组织管理加}
          - {name: 军训模范班集体（成员）, score: 2}
          - name: 党团个人荣誉（三好学生/优秀团员/基础团校优秀学员/党校优秀学员等）
            score_by_level: {院级: 2, 校级: 4, 市级及以上: 6}
            rule: 同类荣誉取高不累加
            route_to: 系统其他项                 # [扩展C] 系统无此节点
            route_note: 计入系统"其他"，得分说明中详细注明
          - name: 党团班级集体荣誉
            score_by_level: {院级: 1, 校级: 2, 市级及以上: 3}
            rule: 同类取高不累加
            exclusions: [负责学生干部（班长、团支书等）不在此项加，在组织管理加分项中加]
            examples: [北京市先进班集体, 首都先锋杯优秀团支部, 双优班集体, 特色班集体]
            route_to: 系统其他项
          - {name: 帮助学院组织活动/朋辈辅导帮扶, score: 1, unit: 分/次, note: 校青指未认证但院团委承认的活动在此加；本科生助教不加分；学生干部分内工作不加分, route_to: 系统其他项}
          - {name: 学习成绩排名进步, score: 2, requirement: 同一学年上下学期学分加权平均分班级排名进步≥5名, evidence: [带排名成绩单（评议小组组长联系辅导员导出）], route_to: 系统其他项}
          - {name: 主题教育活动与班会, score: [0.5, 1], note: 原文为"1或0.5"，主题教育活动1分/班会0.5分，按原文口径, unit: 分/次, combined_cap_with: [基础团校活动], combined_cap: 6, route_to: 系统其他项}
          - {name: 基础团校活动（除开幕式、结业考试）, score: [0.5, 1], note: 原文为"1或0.5"，主题教育活动1分/班会0.5分，按原文口径, unit: 分/次, evidence: [院团委签到名单], route_to: 系统其他项}
          - {name: 基础团校毕业, score: 2, evidence: [院团委资料包], route_to: 系统其他项}

      # ---- 处罚分 ----
      - id: deyu_chufa
        name: 德育处罚分
        note: 多由辅导员/评议小组掌握；问卷仅提示不采集
        items:
          - {name: 怂恿或煽动他人违纪, score: -3, unit: 分/次}
          - {name: 受通报批评或公开批评, score: -3, unit: 分/次}
          - name: 受违纪处分
            tiers: {警告: -5, 严重警告: -10, 记过: -15, 留校察看: -20, 考试作弊: -20}
            system_conflict: 系统只能减5分，冲突部分计入"其他"项并说明
          - {name: 卫生不合格宿舍（宿舍长）, score: -3}
          - {name: 卫生不合格宿舍（成员）, score: -2}
          - {name: 参与非法组织活动, score: -3, unit: 分/次}
          - {name: 散播不良言论/污蔑诽谤他人, score: -2, unit: 分/次}
          - {name: 违背学术道德剽窃成果, score: -8, unit: 分/次}
          - {name: 违反学习纪律（旷课/迟到/早退）, score: [-3, -1], unit: 分/次, special: 若扣分为2m+1则本项只扣2m，剩余1分在"其他"项扣减并说明；一学期旷课≥3次撤销一学年评奖评优资格}
          - {name: 未按时返校注册, tiers: {事假/欠学费/丢证: -2, 无故未到未请假: -5}, route_to: 系统其他项}
          - {name: 未按时完成团员注册, score: -1, route_to: 系统其他项}
          - {name: 缺席班会, tiers: {事假: -1, 无故缺席: -2}, extra: 无故缺席者集体意识项只得一半（5分）, route_to: 系统其他项}
          - {name: 寒暑假社会实践报告/读书笔记抄袭, score: -4, unit: 分/次, route_to: 系统其他项}
          - {name: 晚归, score: -1, unit: 分/次, route_to: 系统其他项}
          - {name: 无故未归, score: -5, unit: 分/次, route_to: 系统其他项}
          - {name: 一票否决, note: 给学校学院声誉造成严重不良影响或违反国家法律（含吸烟），德育按0分计算, severity: veto}

  # ===========================================================================
  # 模块二：智育评价（满分100 = 学习成绩×90% + 人文素质培养×10%）
  # ===========================================================================
  - id: zhiyu
    name: 智育评价
    max_score: 100
    formula: 学习成绩×0.9 + 人文素质培养情况得分×0.1
    sections:
      - id: zhiyu_chengji
        name: 学习成绩
        max_score: 100
        items:
          - {name: 学分加权平均分, type: external_input, formula: Σ(成绩×学分)÷Σ学分（不含任选课）, evidence: [辅导员或学院教务部门提供的excel成绩单]}
      - id: zhiyu_renwu
        name: 人文素质培养情况
        max_score: 100
        sections:
          - id: tongshi
            name: 通识课程选修情况（60分）
            items:
              - name: 通识课门类得分
                type: tiered
                grade_scope: true                 # [年级差异] 各年级档位不同
                tiers_by_grade:
                  大一: {基础（选修两类）: 40, 每多一类: '+10', 上限: 60}
                  大二: {基础（选修一类）: 50, 每多一类: '+10', 上限: 60}
                  大三: {统一: 60}
                  大四: {统一: 60}
                evidence: [教务系统导出的学生成绩总表pdf]
                special: 极特殊情况（疫情等不可抗力）选课但未开课/未考试的，提交证明（如学习通截图）可正常加分；小学期通识课计入
          - id: dushu
            name: 书籍阅读情况（40分）
            items:
              - {name: 阅读习惯, score: 20, requirement: 每学期阅读课外书籍3本且至少一本详细读书笔记或书评报告, evidence: [读书笔记/书评报告]}
              - {name: 学科覆盖, score: 10, requirement: 专业经典书目与非专业书籍均占一定比例}
              - {name: 读书活动参与, score: 10, evidence: [读书活动pdf或照片名单；班级组织需备案+现场照片+签到表]}

  # ===========================================================================
  # 模块三：体质健康与锻炼（满分100）
  # ===========================================================================
  - id: tiyu
    name: 体质健康与锻炼
    max_score: 100
    sections:
      - id: richang_duanlian
        name: 日常体育锻炼（40分档）
        items:
          - name: 日常锻炼频率
            type: tiered
            tiers: {每天1小时及以上: 40, 每周3次及以上: 30, 每周2次: 20, 每周少于2次: 10}
      - id: tizhi_ceshi
        name: 体质与健康测试
        items:
          - name: 体育成绩换算
            type: tiered
            unit: 分/学期
            tiers: {80分及以上: 7.5, 60-80分（不含）: 5, 60分以下: 0}
            grade_scope: true
            tiers_by_grade:
              大一大二: 按上表，需提供教务系统成绩总表pdf
              大三: 不开设体育课，由辅导员建议、全年级统一加分（建议15分），报学院领导小组审核
      - id: tiyu_jiben
        name: 体育活动基本分（20分）
        items:
          - {name: 报名参加体育活动为班级争荣誉, score: 10, type: base}
          - {name: 坚持一种体育项目养成锻炼习惯, score: 10, type: base}
      - id: tiyu_jingsai
        name: 体育赛事加分
        matrix:
          # {参加, 获奖区间}
          国家级:   {参加: 10, 获奖: [8, 10]}
          省部级:   {参加: 8,  获奖: [6, 8]}
          市地区级: {参加: 6,  获奖: [6, 8]}
          校级:     {参加: 5,  获奖: [3, 5]}
          院级:     {参加: 4,  获奖: [2, 4]}
        participation_rule: 同类比赛取高不累加；参加分上限20分
        award_rule: 获奖分在参加分基础上累加
        whitelist_required: true    # ⚠️ 只在《金融学院素质评价评分证明材料详解》目录内的赛事才加参加分
        catalog_examples: [春秋季田径运动会, 新生运动会, 中财杯排球赛, 中财杯篮球赛, 中财青年杯足球赛, 中财杯冬季越野长跑接力, 中财吉尼斯, 北京高校定向运动联赛, 北京市大学生乒乓球赛, 集体健步走, 中财杯羽毛球比赛]
        special_rules:
          - 同类判定：同种运动项目为同类；同一运动会的田赛与径赛为同类；趣味项目与竞技项目为不同类
          - 校级比赛4-8名：按第三名分数-1（即4分）加分
          - 集体项目负责人在获奖时除参加分+获奖分外，可在"其他"项多加2分
          - 破纪录：获奖分翻倍
          - 单人项目和竞技类接力（4×100、4×400、异程接力）不设负责人
          - 目录外比赛须评议小组讨论并报学院领导小组审核备案，且只加获奖分不加参加分

  # ===========================================================================
  # 模块四：学术科研与创新（满分200）
  # ===========================================================================
  - id: xueshu
    name: 学术科研与创新
    max_score: 200
    sections:
      - id: xueshu_jiben
        name: 基本分（50分，5×10）
        items:
          - {name: 撰写课程论文, type: base, score: 10}
          - {name: 参加学术研讨/交流/科研团队, type: base, score: 10}
          - {name: 开展社会调查研究, type: base, score: 10}
          - {name: 学术科技创新与创业训练实践, type: base, score: 10}
          - {name: 自主学习与创新创业能力提高, type: base, score: 10}

      - id: xueke_jingsai
        name: 学科竞赛
        cap_note: 总分上限由各学年统一讨论决定
        matrix:
          # {参加, 获奖区间}；区间按获奖等级区分
          国家级:   {参加: 12, 获奖: [15, 17]}
          省部级:   {参加: 10, 获奖: [12, 14]}   # 含全国性学术协会
          市地区级: {参加: 8,  获奖: [10, 12]}   # 含省部级学术协会
          校级:     {参加: 7,  获奖: [8, 10]}
          院级:     {参加: 6,  获奖: [6, 8]}
        award_tier_rule: 获奖分在区间内按等级区分（如国家级：一等17/二等16/三等15）；特等奖按一等计分录入并在"其他"项+2分说明；一二三等以外奖项按该等级三等奖-2分
        accumulation: 不同竞赛获奖可累计；同一竞赛不同等级取高不累加
        team_rule:
          type: derived
          rule: 负责人按等级计分，成员=负责人得分-2；若成员分不满足系统加分下限，计入"其他"项并说明
        whitelist_required: true    # 只加《证明材料详解》目录内比赛的参加分；目录外有争议由学院领导小组裁定；社团举办的比赛不加分
        special_items:
          - {name: 寒假读书笔记获奖, tiers: {一等奖: 2, 二等奖: 1.5, 三等奖: 1, 优秀奖: 0.5}, cap: 10}
          - {name: 卓越学术终期答辩获奖, rule: 按院级比赛获奖加分，不加参加分}
          - {name: 院级模拟期末考, rule: 只参加不加分；前三名（冠亚季军）加院级获奖分}
        yearly_update_note: 评议结束后班级可收集参赛情况经学院审核纳入《证明材料详解》，形成年度更新版本

      - id: keyan_xiangmu
        name: 科研与创新创业项目
        combined_cap_with: [发表学术文章]
        combined_cap_note: 与发表论文合计设加分上限，上限各学年自定
        matrix:
          # 参加分统一6分（参加时不分级）；立项/结项按级别
          参加: {统一: 6}
          立项: {国家级: 17, 省部级: 15, 市地区级: 12, 校级: 10, 院级: 8}
          结项: {国家级: 15, 省部级: 12, 市地区级: 10, 校级: 8, 院级: 6}
        rules:
          - 立项分按最终结项的级别计算；未立项成功只加参加分
          - 本年度立项但未确定级别的，暂只加参加分；所有未结项项目在结项年度统一按（立项+结项）标准加分，不加参加分
          - 负责人按标准计分；其他参与人员：参加分减半、立项分-3、结项分-2
          - 党建课题可加分；其他党建基金项目或党支部党员正常活动不加分
          - 参与项目>2项者，只按高级别的两项计分
          - 卓越学术人才培养项目参加分按院级参加分计入此项
          - 第八学期特殊规则：大创已立项未到结项的，创新训练项目负责人+8/成员+5，创业训练项目负责人+10/成员+7（创新按院级、创业按校级认定）
        whitelist_required: true   # 项目参照《证明材料详解》，目录外由学院领导小组裁定

      - id: fabiao_wenzhang
        name: 发表学术文章
        combined_cap_with: [科研与创新创业项目]
        exclusions: [摘抄, 新闻简讯]
        matrix:
          # [独立完成, 一作, 二作, 三作及以后]，分/篇
          公开出版学术著作:              [25, 20, 18, 15]
          SCI_SSCI或校AA类及以上期刊:     [30, 24, 21, 18]
          校A类期刊或EI_ISTP检索:        [20, 16, 14, 12]
          公开发行的学术刊物:            [15, '×0.8', '×0.7', '×0.6']   # 按独立完成分比例
          公开出版的学术论文集:          [12, '×0.8', '×0.7', '×0.6']
          校内学术刊物:                 [8, 4, 3, 2]
        extra:
          - {name: 文章入选学术会议及论坛, score: [10, 15], unit: 分/篇}
        rules:
          - 出版不同著作或发表不同论文可累计加分
          - 国内核心期刊以《中央财经大学科研成果认定标准》文件夹为准
          - 须正式出版或发表并提供原件；公开发行刊物/论文集/校内刊物的论文需经学院认定

      - id: xueshu_rongyu
        name: 学术科研与创新类荣誉称号
        items:
          - {name: 先进个人、十杰等, score: [8, 10], note: 按级别加分}

  # ===========================================================================
  # 模块五：组织管理能力（满分100）
  # ===========================================================================
  - id: zuzhi
    name: 组织管理能力
    max_score: 100
    sections:
      - id: zuzhi_jiben
        name: 基本分（20分）
        rule: 同类取高不累加（担任多职只选一项）
        tiers:
          无任职学生: 12-15        # [扩展D] 区间分，无业绩能力分
          宿舍长: 16
          干事/党小组组长: 17
          班委/党支部委员/团委学生会部长/学生党建工作办公室部长/班级助理/芮+导师: 18
          班长/团支书/团委副书记/学生会主席/党支部副书记: 20
        exclusions: [社团学生干部不加分]
        note: 是否为社团组织以证明材料盖章时间的组织情况认定；班级助理可根据实际工作情况由辅导员决定
      - id: zuzhi_yeji
        name: 业绩能力分（70分）
        type: external_input       # 由各管理部门考核出具，引擎做录入+折算校验
        conversion: 原百分制考核分×0.7
        rule: 同类工作加分取高不累加；身兼数职严格取高不累加
        time_proration: {满一年: 1.0, 半年: 0.5, 半学期: 0.25}
        position_weights:
          宿舍长: 0.5
          干事/党小组组长: 0.85
          班委/团支委/党支部委员: 0.9
          部长/班级助理/芮+导师: 0.95
          主席团/党支部副书记/团委副书记/班长/团支书/学习委员: 1.0
        assessment_source:
          班委: 班级学生打分60% + 老师打分40%（班内打分人数达2/3以上方生效）
          宿舍长: 宿舍成员打分70% + 评议小组打分30%
          校级组织: '校团委或相关部门；院级组织：学院团委/学工办；其他：对应管理部门'
      - id: zuzhi_jiafen
        name: 加分
        items:
          - {name: 国家级优秀学生干部或带领组织获省部级以上荣誉, score: 15}
          - {name: 省部级优秀学生干部或带领组织获校级荣誉, score: 12}
          - {name: 校十佳学生干部, score: 8}
          - {name: 校优秀学生干部或带领组织获学院荣誉, score: 5}
        rule: 荣誉称号同类取高不累加，同一条内的荣誉称号算同类
      - id: zuzhi_jianfen
        name: 减分
        note: 工作不认真或失误，由辅导员、学院团委书记或学工办裁定所减分数（问卷不采集）

  # ===========================================================================
  # 模块六：劳动实践评价（满分100）
  # ===========================================================================
  - id: laodong
    name: 劳动实践评价
    max_score: 100
    sections:
      - id: laodong_jiben
        name: 基本分（40分，4×10）
        items:
          - {name: 劳动观念与劳动教育课程, type: base, score: 10}
          - {name: 社会实践与报告获认可, type: base, score: 10}
          - {name: 志愿服务与公益意识, type: base, score: 10}
          - {name: 专业实习实践/创业项目实践, type: base, score: 10}
      - id: laodong_jiafen
        name: 加分
        items:
          - {name: 志愿服务时长, rate: 0.2分/小时, cap: 10, evidence: [校团委和学生所在单位认证]}
          - {name: 志愿服务荣誉称号, score_by_level: {校级: 3, 北京市级: 4, 国家级: 5}, rule: 同类取高不累加}
          - name: 社会实践报告/调查报告获奖
            score_range_by_level: {国家级: [20,22], 省部级: [18,20], 市区级: [16,18], 校级: [12,16], 院级: [8,12]}
          - name: 社会实践团队项目中标
            score_range_by_level:
              负责人: {国家级: [20,22], 省部级: [16,18], 市区级: [14,16], 校级: [10,14], 院级: [8,10]}
              成员:   {国家级: [16,18], 省部级: [12,14], 市区级: [10,12], 校级: [8,12], 院级: [6,8]}
          - name: 社会实践团队获奖
            score_range_by_level:
              负责人: {国家级: [20,22], 省部级: [16,18], 市区级: [14,16], 校级: [10,14], 院级: [8,10]}
              成员:   {国家级: [16,18], 省部级: [12,14], 市区级: [10,12], 校级: [8,12], 院级: [6,8]}
          - {name: 创业实践项目获立项资助, score_by_level: {国家级: 22, 省部级: 18, 市区级: 16, 校级: 12, 院级: 10}}
          - {name: 先进个人、十杰等, score_by_level: {国家级: 12, 省部级: 10, 市区级: 8, 校级: 6, 院级: 4}}
          - {name: 实习实践活动受服务单位表彰, score: [10, 15], note: 只限课余自行或组队参与的实习实践（非学校组织立项），须有公开报道或可见证的显著贡献}
        rules:
          - 同一项目多项奖励取高不累加
          - 社会实践须全程参与（申报、家长意见反馈、实地走访、新闻稿、安全报备、报告撰写缺一不可）
          - 团队中标除极特殊情况按同等级最低分；有国家重点领域重大成果并经认定的可酌情上浮
          - 只认定中央财经大学相关部门组织的实践，不认可个人组织的实践
          - 青马班（校级）、卓越领导力人才（院级）、卓越职业人才（院级）按中标成员最低分加对应等级分（校级8分、院级6分）
          - 参与有影响力的国际组织实习，酌情加15-18分并报辅导员审核批准
          - 应急处突等特殊志愿活动按紧迫程度与实际贡献综合认定

  # ===========================================================================
  # 模块七：美育素养评价（满分100）
  # ===========================================================================
  - id: meiyu
    name: 美育素养评价
    max_score: 100
    sections:
      - id: meiyu_jiben
        name: 基本分（30分）
        items:
          - {name: 参加文化活动营造文化氛围, type: base, score: 5}
          - {name: 培养艺术特长和文艺兴趣, type: base, score: 5}
          - {name: 参与文化艺术活动或社团至少一项, type: base, score: 10}
          - {name: 文艺知识与审美表达能力, type: base, score: 10}
      - id: meiyu_jingsai
        name: 文化、艺术类竞赛
        matrix:
          国家级:   {参加: 14, 获奖: [15, 17]}
          省部级:   {参加: 12, 获奖: [13, 15]}
          市地区级: {参加: 10, 获奖: [10, 12]}
          校级:     {参加: 8,  获奖: [8, 10]}
          院级:     {参加: 6,  获奖: [6, 8]}
        rule: 同类比赛取高不累加；参赛参演加分观众不加（需现场照片等证明）
        team_rule: 负责人按等级计分，成员=负责人-2（不满足系统下限计入"其他"并说明）
        whitelist_required: true   # 参加分只加《证明材料详解》目录内项目
        catalog_cap: 目录外参加分项目总数≤6项（非知识竞赛类≤3项，知识竞赛类≤4项）
        special_items:
          - name: 宿舍评比获奖
            tiers: {学院优秀宿舍: 6, 学校十佳优秀宿舍: 10, 学校优秀宿舍: 9, 学校特色宿舍: 8}
            rule: 同类取高不累加；宿舍所有成员加相同分数
      - id: meiyu_fabiao
        name: 发表文学、艺术类作品
        matrix:
          公开出版文学艺术著作:   [24, 21, 18, 15]
          国家级权威报刊媒体:     [20, 15, 12, 10]
          省级重要报刊媒体:       [10, 8, 6, 5]
          其他公开发行报刊媒体:   [5, 4, 3, 2]
          校内报刊:              [3, 2, 1, 0.5]
          院级刊物:              [2, 1, 0.5, 0.25]
        extra:
          - {name: 个人画展/摄影展/个人演出, score: 8, unit: 分/次}
        rules:
          - 省级以上报刊文学作品≥2000字；校内及其他刊物≥1000字；须有刊物原件
          - 同一作品不同刊物发表/转载取高不累加；无法认定级别的由学院领导小组裁定
          - 网络小说不计为出版（出版须有ISBN号）

# =============================================================================
# 总成绩公式（金融学院·第二十二条）
# =============================================================================
total_formula:
  综合素质评价总成绩: 德育×30% + 体育锻炼×10% + 智育×60% + 学术科研与创新×10% + 组织管理×10% + 劳动实践×10% + 美育×10%
  排名成绩: 基本素质评价成绩×80% + 自选发展性单项一 + 自选发展性单项二
  排名成绩说明: 从四项发展性素质单项（每项=该项得分×10%）中自选两项计入排名

# =============================================================================
# 校对结论记录（2026-09-04，梁育豪/张育豪 双人确认）
# =============================================================================
review_resolution:
  - '⏳ 第1条（《证明材料详解》外部依赖）：队长已借到，稍后提供，届时建白名单子配置；引擎 whitelist_required 逻辑不受影响可先行开发'
  - '✅ 第2条（系统映射）：确认——德育奖励分6-13项、处罚分9-14项映射到学校系统「德育加分」「德育减分」节点（走"申请加分"流程，在得分说明中注明细项）；插件预填时自动生成规范说明文字'
  - '✅ 第3条（三方加权）：确认保留输入端口——评议小组分、辅导员分为外部输入项（external_input），引擎只算自评建议分'
  - '✅ 第4条（学年自定上限）：确认保留询问——问卷向学生询问本评议年度的竞赛/科研合计上限'
  - '✅ 第5条（班级自定"其他"项）：确认保留——问卷提示"以你班班会公布为准"'
  - '⏳ 第6条（zbdm 锚点）：待测评窗口开启后用金融学院学生账号快照复核'
