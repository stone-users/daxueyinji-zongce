  # ===========================================================================
  # 模块五：组织管理能力（满分100）
  # ===========================================================================
  - id: zuzhi
    name: 组织管理能力
    max_score: 100
    sections:
      - id: zuzhi_jiben
        name: 基本分（20分）
        items:
          - {name: 基本分1（承担组织任务的责任性）, type: base, score: 10, source_quote: "具有较强责任性，能够主动承担起组织的任务，加10分"}
          - {name: 基本分2（为活动出谋划策）, type: base, score: 5, source_quote: "积极为各项活动出谋划策，成功实现活动目标，加5分"}
          - name: 基本分3（担任学生干部）
            type: base
            score: 5
            note: >
              各类学生干部基本分为满分；无职务者不加基本分3。
              特殊情况下非干部同学提供证明后可酌情加基本分1或2（如参与班级建家、班级公众号建设等）。
            source_quote: "担任学校干部（校级、院级、班级的均可），勤勉认真，踏实负责，加5分；各类学生干部队伍基本分为满分，如无特殊情况，无任何职务者不加基本分3"
      - id: zuzhi_yeji
        name: 业绩能力分（70分）
        type: external_input     # 分数由各级组织考核出具，引擎不计算，只做录入与校验
        max_score: 70
        depends_on: {item: 基本分3（担任学生干部）, when: yes}   # 前置条目答"否/没有"时本组隐藏、不计入未答、不计分
        source_quote: "担任多项职务取得分最高项为基准，其余成绩按照级别加分（优加5分/项，良加3分/项，合格加1分/项）。但满分以70分为限。基本分和业绩能力得分标准均为学年工作得分，若工作时间为一学期，得分标准均减半。分数来源：校级分数由校团委学生会各部门、园委会各部门、学生处支部委员会出具，院级分数由学院团委出具，班级分数由班级同学和辅导员打分。其他部门的学生组织分数由具体组织出具，且必须有学校相关部门的公章"
        rules:
          - 担任多项职务：取得分最高项为基准，其余职务按考核等级加分（优+5/项，良+3/项，合格+1/项），总分以70为限
          - 考核比例：校级 40%优/50%良/10%合格；院级、班级、其他 30%优(70-56)/60%良(55-41)/10%合格(40以下)
          - 工作时间为一学期的，得分标准减半
          - 分数来源：校级由校团委学生会等部门出具；院级由学院团委出具；班级由班级同学和辅导员打分；须有公章
      - id: zuzhi_rongyu
        name: 荣誉称号加分
        system_node: 组织管理
        zbdm: c992f2f5f350434f9eaff2dc87b48148
        depends_on: {item: 基本分3（担任学生干部）, when: yes}   # 前置条目答"否/没有"时本组隐藏、不计入未答、不计分
        cap: 30
        rule: 取高不累加
        scope_limit: 仅限校级/院级团委颁发的荣誉，或由学校团委推荐的省级、国家级奖项
        items:
          - {name: 国家级优秀学生干部, score: 15}
          - {name: 省部级优秀学生干部, score: 12}
          - {name: 校十佳学生干部, score: 8}
          - {name: 校优秀学生干部, score: 5}
          - {name: 院级优秀学生干部, score: 3}

  # ===========================================================================
  # 模块六：劳动实践评价（满分100）
  # ===========================================================================
  - id: laodong
    name: 劳动实践评价
    max_score: 100
    sections:
      - id: laodong_jiben
        name: 基本分（40分）
        items:
          - name: 劳动教育（劳动观念与技能）
            type: base
            max_score: 10
            note: 2022级起实施（20/21级此项满分）；参加学校或学院组织的劳动实践活动一次+2分，满分10分；通识课活动不计入
            evidence: [辅导员提供名单]
            source_quote: "热爱劳动，能够树立正确的劳动观念，掌握基本的劳动技能，具有积极的劳动精神，具备良好的劳动习惯和品质，满分10分；此项规则从2022级开始实施，20级和21级此项为满分：参加由学校或学院组织的劳动实践活动可以加分，名单由辅导员提供。一次活动可加2分，满分10分。通识课上组织的活动不计入分数"
          - name: 社会实践参与
            type: base
            score: 10
            requirement: 仅指校团委组织的社会实践；其他自行参加的不计分
            source_quote: "积极服务国家发展战略需求，投身社会和基层，积极参与社会实践活动，撰写实践报告，实践成果获得组织单位或实践对象的认可，满分10分；此社会实践指：校团委组织的社会实践；其他学生自行参加的社会实践不计入分数"
          - {name: 志愿服务意识, type: base, score: 10, default: true, source_quote: "乐于帮助他人，具有公共服务意识，积极参加志愿服务和社会公益活动，在面对重大疫情、灾害时具有主动作为的奉献精神，满分10分；如无特殊情况，所有人获得此分"}
          - name: 实习/创业实践
            type: base
            score: 10
            requirement: 特指非学院集体实习，需单位盖章实习证明，实习不少于两周；创业类需创业设计/创业报告
            evidence: [单位盖章实习证明]
            source_quote: "利用所学专业知识到有关单位从事实习实践活动，并获得实习实践单位的认可；或依托专业特长，开展创业项目设计、创业运营模拟等实践项目并取得初步成果，满分10分；此实习特指非学院集体实习工作，需要提供单位盖章实习证明，实习时间不少于两周；创业类项目需要提供创业设计、创业报告等材料"

      # ---- 劳动实践加分：对应系统节点 ----
      - id: laodong_jiafen
        name: 加分
        system_node: 加分   # 位于「劳动实践评价」节点下
        zbdm: c618f6ec8a0b4225a743e1749e8231da
        items:
          - name: 志愿服务时长
            type: bonus
            rate: 0.2分/小时
            cap: 10
            note: 校团委和学院认定，时段为前一年9月1日至当年8月31日
            question_hint: 本学年你的志愿时长是多少小时？（志愿北京/校团委记录）
            source_quote: "参加志愿服务和社会公益活动，0.2分/小时（一学年加分最高不超过10分）；校团委和学院进行认定（时间段在前一年9月1日-当年8月31日，具体以校团委、学院团委认证为准）"
          - name: 志愿服务荣誉称号
            type: bonus
            widget: award_list        # 同一奖项可多次获得，渲染为可多条添加的获奖记录卡
            aggregate: max            # 原文/规则为"取高不累加"
            score_by_level: {国家级: 5, 省市级: 4, 校级及以下: 3}
            rule: 取高不累加
            note: 需校团委认定的优秀志愿者、十佳志愿者、五星志愿者等；省市级国家级需学校推荐；1-4星志愿者及其他组织称号不予加分
            source_quote: "志愿服务社会公益荣誉称号：国家级加5分，省市级加4分，校级及以下加3分；需要学校团委认定的优秀志愿者、十佳志愿者、五星志愿者等荣誉称号；省市级、国家级称号需要由学校推荐获得；1至4星志愿者、其他组织颁布的称号不予加分"
          - name: 社会实践报告获奖
            type: bonus
            widget: award_list        # 渲染为可多条添加的获奖记录卡
            aggregate: max            # 保守口径：取高不累加
            score_range_by_level: {国家级: [20,22], 省部级: [18,20], 市区级: [16,18], 校级: [12,16], 院级: [8,12]}
            note: 原文未说明同类多条获奖累计方式，按取高不累加处理，多条记录以评议小组认定为准
            requirement: 仅指校学生处/宣传部/团委组织的专项社会实践报告撰写；寒暑期社会实践报告获奖不在此项；其他学校/社会组织/公司组织的实践报告获奖不予认定
            source_quote: "社会实践报告获奖：国家级加20-22分，省部级加18-20分，市区级加16-18分，校级加12-16分，院级加8-12分；社会实践报告获奖指：由校学生处、宣传部、团委组织的专项社会实践报告撰写，寒暑期社会实践报告获奖不在此加分；由其他学校、社会组织、公司组织的社会实践的报告获奖不予认定"
          - name: 社会实践团队项目立项
            type: bonus
            widget: award_list        # 渲染为可多条添加的立项记录卡
            aggregate: max            # 原文规则"同一项目获得多项奖励取高不累加"
            matrix:
              负责人: {国家级: 22, 省部级: 18, 市区级: 16, 校级: 14, 院级: 10}
              成员:   {国家级: 18, 省部级: 14, 市区级: 12, 校级: 10, 院级: 8}
            rules: [立项但未按期结项的立项分不加, 同一项目多项奖励取高不累加]
            note: matrix 外层键为角色（负责人/成员）、内层为级别——核对 PDF 原文如此
            source_quote: "社会实践团队项目立项：国家级立项负责人加22分，成员加18分；省部级立项负责人加18分，成员加14分；市区级立项负责人加16分，成员加12分；校级立项负责人加14分，成员加10分；院级立项负责人加10分，成员加8分。1.如果社会实践立项但未按期结项，则立项分不予加分。2.同一项目获得多项奖励取高不累加。"
          - name: 社会实践团队获奖
            type: bonus
            widget: award_list        # 渲染为可多条添加的获奖记录卡
            aggregate: max            # 保守口径：取高不累加
            score_range_by_level:
              负责人: {国家级: [20,22], 省部级: [16,18], 市区级: [14,16], 校级: [10,14], 院级: [8,10]}
              成员:   {国家级: [16,18], 省部级: [12,14], 市区级: [10,12], 校级: [8,12], 院级: [6,8]}
            rules: [按奖项级别在分数范围内递减, 优秀奖按范围内最低分, 仅校团委组织的实践, 自行参加或校外机构组织不计分]
            note: 原文未说明同类多条获奖累计方式，按取高不累加处理，多条记录以评议小组认定为准
            source_quote: "社会实践团队获奖：国家级负责人加20-22分，成员加16-18分；省部级负责人加16-18分，成员加12-14分；市区级负责人加14-16分，成员加10-12分；校级负责人加10-14分，成员加8-12分；院级负责人加8-10分，成员加6-8分。此社会实践指：学校团委组织的社会实践；其他学生自行参加的社会实践、或校外机构组织的社会实践不计入分数。社会实践团队获奖分，按照奖项级别在分数范围内递减，优秀奖按分数范围内的最低分计算"
          - name: 学院暑期集体实习
            type: bonus
            tiers: {参加: 10, 参加且团队获学院表彰: 15}
            note: 学生自行参加的实习不在此项加分
            source_quote: "实习实践活动受服务单位认可或表彰（附证明）15分；本加分特指：参加学院组织的暑期集体实习项目，参加+10分，参加并所在团队获学院表彰+15分。学生自行参加的实习不在此项加分"
