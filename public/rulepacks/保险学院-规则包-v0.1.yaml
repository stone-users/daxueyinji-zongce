# =============================================================================
# 中央财经大学 · 保险学院 综测规则包
# =============================================================================
# 用法：本文件是「规则引擎」读取的配置，不是代码。
#   - 每个 item 的 source_quote 字段保留了细则原文，供人工校对逐条比对
#   - system_node / zbdm 字段用于浏览器插件在学校系统页面定位
#   - zbdm 来自 2026-09-04 页面快照，年度任务重建后可能变化，窗口开启时需复核
#
# 校对状态约定：review_status: draft → reviewed（双人交叉校对后才允许上线）
# =============================================================================

meta:
  university: 中央财经大学
  college: 保险学院
  version: "0.3"
  review_status: reviewed         # ✅ 2026-09-04 双人交叉校对通过；2026-09-06 补全全部条目原文依据
  source_doc: 保险学院综测细则.pdf（2024年3月修订）
  extracted: 2026-09-04
  reviewers: [梁育豪, 张育豪]
  linked_configs:
    - 保险学院-活动等级目录-v0.1.yaml   # 学科竞赛/活动定级依据

# ---------------------------------------------------------------------------
# 全局口径（适用于所有模块）
# ---------------------------------------------------------------------------
global_rules:
  eval_period: "前一年9月1日 至 当年8月31日（以材料落款时间为准）"
  common_constraints:
    - 奖学金、助学金不作为加分证明材料（不能以奖评奖）
    - 同一成果不能重复评价；所有成果须以中财学生身份获得
    - 荣誉证书需有颁证方单位公章方为有效
    - 无证明材料不得加分；材料需能看到姓名和比赛名称等信息
    - 比赛/活动定级参照《保险学院本科生课外活动等级认定办法》，有争议报学院认定委员会
    - 班级评议环节只减不增：自评未申报的项目评议时不予补加
  rank_levels: [国家级, 省部级, 市地区级, 校级, 院级]   # 统一级别词表
  award_ranks: [一等奖, 二等奖, 三等奖]                   # 特等奖按一等奖计
  rank_alias_rules:
    - 特等奖 → 一等奖
    - 按名次发奖的：第1名 → 一等奖；第2名 → 二等奖；第3名及以后 → 三等奖

# =============================================================================
# 模块一：德育评价（满分100）
# 结构：基本素质六项(政治思想/学习态度/道德品质/法纪观念/集体意识/生活修养)
#       + 德育加分(上限30) - 德育减分
# =============================================================================
modules:
  - id: deyu
    name: 德育评价
    max_score: 100
    formula: "六项基本素质得分之和 + 德育加分(上限30) - 德育减分"

    sections:

      - id: deyu_zhengzhi
        name: 政治思想
        range: [0, 20]
        items:
          - name: 政治思想基本分
            type: base
            score: 14
            default: true           # 无特殊情况所有人可得
            source_quote: "无反党、反国家、反社会主义的言论和行为……基本分14分，无特殊情况所有人可得"
          - name: 已提交入党申请书
            type: bonus
            score: 2
            recurrence: 提交过的同学每年都加分
            evidence: [辅导员或团支书提供名单]
            question_hint: 你是否提交过入党申请书？
            source_quote: "已提交入党申请书的同学，加2分；名单由辅导员或团支书提供；只要提交过的同学，每年都加分"
          - name: 入党积极分子/预备党员/党员
            type: bonus
            score: 2
            penalty_clause: 未积极参加党组织活动（如红色1+1、党建基金、党员先锋活动），缺席一次扣1分，最多扣2分
            evidence: [辅导员提供名单]
            source_quote: "政治表现良好，思想端正，被推选为入党积极分子、预备党员、党员，加2分"
          - name: 积极参加基础团校活动
            type: bonus
            score: 2
            penalty_clause: 缺席一次扣0.5分，最多扣2分
            special: 大三同学此项满分
            evidence: [学生会组织部提供参加名单]
            source_quote: "政治思想、政治行为表现良好，且积极参加基础团校活动，加2分……大三同学此项满分"

      - id: deyu_xuexi
        name: 学习态度
        range: [0, 15]
        items:
          - name: 学习态度基本分
            type: base
            score: 9
            default: true           # 无作弊现象同学都可得
            source_quote: "不违反学习纪律，无舞弊和作弊行为。基本分9分，无作弊现象同学都可得"
          - name: 参加讲座与学术活动
            type: bonus
            score: 1
            unit: 分/次
            cap: 4
            evidence: [学生会出具的讲座签到记录]
            question_hint: 本学年你参加过几次学院/学校组织的讲座？
            source_quote: "每参加一次讲座+1分，最高分为4分，以学生会出具的讲座签到情况为加分依据"
          - name: 学习上帮助同学
            type: bonus
            score: 2
            examples: [各科课代表, 参与整理班级复习资料并在全班分享]
            evidence: [相应证明材料]
            source_quote: "热爱学习，追求真理，且乐于在学习上帮助同学，共同进步，加2分"

      - id: deyu_daode
        name: 道德品质
        range: [0, 15]
        items:
          - name: 道德品质分
            type: base
            score: 15
            default: true
            note: 无特殊情况为满分；扣分名单由辅导员提供
            source_quote: "积极倡导社会公德，尊师重道……无特殊情况为满分"

      - id: deyu_faji
        name: 法纪观念
        range: [0, 10]
        items:
          - name: 法纪观念分
            type: base
            score: 10
            default: true
            note: 无特殊情况满分；出现违法违纪现象为0分
            source_quote: "发挥遵纪守法的先锋模范作用……出现违法违纪现象为0分"

      - id: deyu_jiti
        name: 集体意识
        range: [0, 10]
        items:
          - name: 集体意识基本分
            type: base
            score: 8
            penalty_clause: 少参加一次班级集体活动扣1分（以班级活动考勤表为准，请假不扣）
            source_quote: "基本分8分，少参加一次班级集体活动扣1分"
          - name: 对班级建设有实质性贡献
            type: bonus
            score: 2
            examples: [班委, 积极参加班级建家活动]
            evidence: [相应证明材料]
            source_quote: "在班建中献计献策、担任相关工作的同学加分……加2分"

      - id: deyu_shenghuo
        name: 生活修养
        range: [0, 10]
        items:
          - name: 生活修养分
            type: base
            score: 10
            default: true
            note: 扣分名单由辅导员提供
            source_quote: "具有崇高的生活修养与志趣，明礼修身，甘为表率，加10分"

      # ---- 德育加分：上限30分，对应系统节点「德育加分」 ----
      - id: deyu_jiafen
        name: 德育加分
        cap: 30
        system_node: 德育加分
        zbdm: a55ed88f34f944f786a87ecccd30a4dc   # 2026-09快照，待复核
        items:
          - name: 获通报表扬
            type: bonus
            multi_count:
              - {label: 校级及以上, score: 5}
              - {label: 院级, score: 3}
            examples: [三好学生, 优秀党员, 优秀团员, 优秀团支书, 优秀班长, 繁星中财, 党校优秀学员, 基础团校优秀学员, 班级之星, 龙马先锋班优秀学员, 学思团优秀学生骨干]
            source_quote: "校级及以上加5分，仅包括：三好学生、优秀党员、优秀团员、优秀团支书、优秀班长、繁星中财等；院级加3分，院级通报表扬包括：党校优秀学员、基础团校优秀学员、班级之星等学院认定的其他荣誉"
          - name: 优秀宿舍（宿舍长）
            type: bonus
            score: 5
            role: 宿舍长
            examples: [学校评选的优秀宿舍, 十佳宿舍, 风采宿舍]
            source_quote: "优秀宿舍：宿舍长加5分，宿舍成员加4分"
          - name: 优秀宿舍（成员）
            type: bonus
            score: 4
            role: 宿舍成员
            source_quote: "优秀宿舍：宿舍长加5分，宿舍成员加4分；学校评选的优秀宿舍、十佳宿舍、风采宿舍在此加分"
          - name: 无偿献血/骨髓捐赠
            type: bonus
            score: 3
            unit: 分/次
            evidence: [献血证等相关证明]
            question_hint: 本学年你参加过无偿献血或骨髓捐赠吗？几次？
            source_quote: "参加无偿献血、骨髓捐赠等活动，加3分/次，需提供证明"
          - name: 拾金不昧/见义勇为
            type: bonus
            score: 3
            unit: 分/次
            evidence: [相关部门证明（如保卫处）]
            source_quote: "有拾金不昧或见义勇为行为，加3分/次，需相关部门提供证明"
          - name: 军训标兵
            type: bonus
            score: 3
            mutex_with: [军训先进个人]        # 取高不累加
            source_quote: "军训期间获标兵称号加3分，与先进个人取高不累加"
          - name: 军训先进个人
            type: bonus
            score: 2
            mutex_with: [军训标兵]
            source_quote: "军训期间获先进个人称号，加2分，与标兵称号取高不累加"

      # ---- 德育减分：对应系统节点「德育减分」 ----
      - id: deyu_jianfen
        name: 德育减分
        system_node: 德育减分
        zbdm: eefdac1219274a22b75122a683b3406e
        note: 减分项多由辅导员/评议小组掌握，问卷中一般以"确认无此类情况"呈现
        items:
          - {name: 怂恿或煽动他人违纪, type: penalty, score: -3, unit: 分/次, source_quote: "1.怂恿或煽动他人违纪，减3分/次；扣分名单由辅导员提供"}
          - {name: 受通报批评或公开批评, type: penalty, score: -3, unit: 分/次, source_quote: "2.受通报批评或公开批评，减3分/次；扣分名单由辅导员提供"}
          - {name: 受违纪处分, type: penalty, score: -5, source_quote: "3.受违纪处分，减5分；扣分名单由辅导员提供"}
          - {name: 卫生不合格（宿舍长）, type: penalty, score: -3, role: 宿舍长, source_quote: "4.卫生不合格，减3分（宿舍长）/减2分（成员）；扣分名单由辅导员提供"}
          - {name: 卫生不合格（成员）, type: penalty, score: -2, role: 宿舍成员, source_quote: "4.卫生不合格，减3分（宿舍长）/减2分（成员）；扣分名单由辅导员提供"}
          - {name: 参与非法组织的活动, type: penalty, score: -3, unit: 分/次, source_quote: "5.参与非法组织的活动，减3分/次；扣分名单由辅导员提供"}
          - {name: 散播不良言论或污蔑、诽谤他人, type: penalty, score: -2, unit: 分/次, source_quote: "6.散播不良言论或污蔑、诽谤他人，减2分/次；扣分名单由辅导员提供"}
          - {name: 违背学术道德、剽窃他人学术成果, type: penalty, score: -8, unit: 分/次, source_quote: "7.违背学术道德，剽窃他人学术成果，减8分/次；扣分名单由辅导员提供"}
          - {name: 违反学习纪律（旷课/迟到/早退）, type: penalty, score: -2, unit: 分/次, evidence: [任课老师/辅导员/学委抽查记录], source_quote: "8.违反学习纪律，旷课、迟到或早退，减2分/次；证据提供：任课老师、辅导员、学委不定期抽查记录"}
          - {name: 其他, type: penalty, score: null, note: 由班级综测评议小组认定, source_quote: "9.其他，根据实况规定；由班级综测评议小组认定"}

  # ===========================================================================
  # 模块二：智育评价（学习成绩满分100；人文素质培养满分100）
  # ===========================================================================
  - id: zhiyu
    name: 智育评价
    note: >
      已确认（2026-09-04 双人校对）：本模块为百分制计分；
      细则表头"学习成绩满分100分，加分满分100分"中，"加分"即指【人文素质培养情况】部分的加分。
      学校系统内智育=学习成绩+人文素质培养情况；学习成绩按辅导员提供的加权平均分（正考，含小学期）。
    sections:
      - id: zhiyu_chengji
        name: 学习成绩
        max_score: 100
        items:
          - name: 加权平均分
            type: external_input      # 非问卷可算，由辅导员/教务提供成绩单
            formula: "Σ(课程成绩×学分) ÷ Σ学分（不含任选课）"
            evidence: [教务系统导出成绩单pdf]
            source_quote: "由辅导员提供：本学年（含小学期成绩）加权平均分（正考）"

      - id: zhiyu_renweng
        name: 人文素质培养情况
        max_score: 100
        system_node: 人文素质培养情况
        sections:
          - id: tongshi
            name: 通识课程选修情况
            max_score: 60
            items:
              - name: 通识课门类数得分
                type: tiered
                tiers:
                  "少于2个组类": 0
                  "2个组类": 40
                  "3个组类": 50
                  "4个组类及以上": 60
                note: 门类数为从大一到评价时累计选修并通过的组类数；无门类的通识课可算入任意门类
                evidence: [教务系统导出成绩单（含姓名学号、标注通识课名称及成绩）]
                question_hint: 你从大一到现在通过了几个组类的通识选修课？（成绩单可查）
                source_quote: "选择并通过两个组类加40分，三个组类加50分，四个组类及以上加60分"
          - id: dushu
            name: 书籍阅读情况
            max_score: 40
            items:
              - name: 阅读习惯（读书笔记）
                type: bonus
                score: 20
                requirement: 每学年课外书籍达3本，且有一本读书笔记（16开≥30页或32开≥60页，手写，开头注明"X年X月X日"写作日期；课堂笔记除外；评议小组批注"已阅"）
                evidence: [手写读书笔记]
                source_quote: "每学年课外书籍达到3本，并拥有一本16开至少30页、32开至少60页的读书笔记，加20分"
              - name: 阅读覆盖面
                type: bonus
                score: 10
                requirement: 专业经典书目≥3本 且 非专业书籍≥3本
                evidence: [图书馆借阅记录截图等]
                source_quote: "所读书籍覆盖多个学科领域，专业经典书目至少3本，非专业书籍至少3本，加10分"
              - name: 参加读书会/书评会
                type: bonus
                score: 10
                exclusions: [学生社团自行组织的读书会不计入]
                extra: 若读书会组织部门同时组织竞赛活动，获奖者可在参与分基础上再加5分
                source_quote: "积极参与校团委、学生处、图书馆等学校相关部门或学院组织的读书会、书评会等活动，加10分"

  # ===========================================================================
  # 模块三：体质健康与锻炼（满分100）
  # ===========================================================================
  - id: tiyu
    name: 体质健康与锻炼
    max_score: 100
    sections:
      - id: richang_duanlian
        name: 日常体育锻炼
        items:
          - name: 日常锻炼频率
            type: tiered
            tiers:
              每天课外锻炼1小时及以上: 40
              每周课外锻炼3次及以上: 30
              每周课外锻炼2次: 20
              每周课外锻炼少于2次: 10
            note: 由班级评议小组酌情决定，难以判断时可全班获得10分
            question_hint: 你平时的课外锻炼频率最接近哪一档？
            source_quote: "每天课外体育锻炼1小时及以上，满分40分；每周课外体育锻炼3次及以上，满分30分；每周课外体育锻炼2次，满分20分；每周课外体育锻炼少于2次，满分10分；由班级评议小组酌情决定（如难以判断可以全班获得10分）"
      - id: tizhi_ceshi
        name: 体质与健康测试
        items:
          - name: 体测成绩
            type: tiered
            tiers:
              良好及以上: 15
              合格: 10
              不合格/未参加: 0
            note: 学校提供健康测试标准时按学校记录给分；保健班或经审批免测同学按合格处理（+10）
            source_quote: "良好及以上加15分，合格加10分；学校提供健康测试标准时按照学校记录给分（保健班或经审批同意的体测免测同学按合格处理，加10分）"
      - id: tiyu_jiben
        name: 体育活动基本分
        items:
          - name: 报名参赛意识
            type: base
            score: 10
            note: 无特殊情况所有人满分；未参加班级组织体育活动给8分
            source_quote: "树立体育锻炼意识，积极报名参加学校、班级组织的各项体育活动、为班级争取荣誉，满10分；如无特殊情况，所有人获得此分，未参加班级组织的体育活动给8分"
          - name: 坚持一项体育运动
            type: base
            score: 10
            default: true
            source_quote: "坚持喜爱一种体育运动，养成锻炼习惯，满10分；如无特殊情况，所有人获得此分"
      # ---- 体育赛事加分：对应系统节点 ----
      - id: tiyu_jiafen
        name: 体育活动加分
        system_node: 体育活动
        zbdm: 0a0daea8fcec4ef9b667fd3130f2f069
        participation_rule: 参加分不累加，仅按参加的最高级别比赛加一次参加分
        award_rule: 获奖分在参加分基础上累加，获奖分本身可累加
        team_rule: 团体类比赛（篮球、足球等）参赛队员均可获得相应级别加分
        matrix:
          # [参加分, 一等, 二等, 三等]
          国家级:   {参加: 10, 一等奖: 10, 二等奖: 9, 三等奖: 8}
          省部级:   {参加: 8,  一等奖: 9, 二等奖: 8, 三等奖: 7}
          市地区级: {参加: 6,  一等奖: 8, 二等奖: 7, 三等奖: 6}
          校级:     {参加: 4,  一等奖: 6, 二等奖: 5, 三等奖: 4}
          院级:     {参加: 2,  一等奖: 4, 二等奖: 3, 三等奖: 2}
        special_items:
          - {name: 中财吉尼斯参加, score: 5}
          - {name: 中财吉尼斯破纪录, score: 5, unit: 分/项}
          - {name: 中财社团文化节参加, score: 1}
