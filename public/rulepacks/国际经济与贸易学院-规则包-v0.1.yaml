# =============================================================================
# 中央财经大学 · 国际经济与贸易学院 综测规则包
# =============================================================================
# 复用保险学院 v0.2 schema + 金融/财税扩展
# 本院特点：
#   [特点1] "全员统一分"模式（uniform_all）：人文素质全员100、日常锻炼全员40、
#           体育基本分全员20、学术基本分全员50、美育基本分全员30 —— 引擎直接给默认值
#   [特点2] 级别认定走"教务处《大创系统学科竞赛收录汇总表》+ 年级活动等级评议表"双轨
#   [特点3] 志愿时长折算：校内小时直接加，院内小时折半，总上限10分
#   [特点4] 团体项目成员只比负责人少加1分（保险是×0.8，财税是减4/减2——三院三种算法！）
# =============================================================================

meta:
  university: 中央财经大学
  college: 国际经济与贸易学院
  version: "0.2"
  review_status: reviewed         # ✅ 2026-09-04 双人交叉校对通过
  source_doc: 国际经济与贸易学院全日制本科学生素质评价细则（2024年12月29日发布施行）
  extracted: 2026-09-04
  reviewers: [梁育豪, 张育豪]
  linked_configs: []              # 外部依赖：教务处《大创系统学科竞赛收录汇总表》+ 年级《活动等级评议表》（见附件2，需另获取）

global_rules:
  eval_period: 学年制（按校历从注册之日算起；大四下只评第七学期；第八学期四年总评）
  common_constraints:
    - 人证不能作为证明材料；奖学金、助学金不作为加分证明材料
    - 活动名单公示后一周内确认，过期无效；2019年9月1日后所有活动需留痕
    - 提交与事实不符的材料取消该项加分资格
    - 虚假评定：德育0分，严重者全院通报，情节非常严重取消一学年全部评奖评优资格
    - 参与项加分均指参与完全部过程，只报名不参与取消加分
  review_flow: 学生自评 → 班级评议（≥20%，辅导员审核确定）→ 辅导员写实评价 → 公示 → 最终结果
  dispute: 自评与评议不一致时交学院素质评价领导小组评定
  rank_levels: [国家级, 省部级, 市地区级, 校级, 院级]

modules:
  # =========================================================================
  # 德育（满分100 = 基本分80 + 奖励分 - 处罚分）
  # =========================================================================
  - id: deyu
    name: 德育评价
    max_score: 100
    formula: 基本分(80) + 奖励分 - 处罚分
    sections:
      - id: deyu_jiben
        name: 德育基本分（80分）
        type: anchor_tiers
        items:
          - {name: 政治思想, max: 20, tiers: {优: [16,20], 良: [12,16], 合格: [0,12]}, anchor: '优=坚定共产主义信仰发挥模范作用；良=坚定理想信念、积极向党组织靠拢；合格=无反动言行、三观正确'}
          - {name: 学习态度, max: 15, tiers: {优: [12,15], 良: [9,12], 合格: [0,9]}, veto: 有考试违纪行为本项0分}
          - {name: 道德品质, max: 15, tiers: {优: [12,15], 良: [9,12], 合格: [0,9]}, veto: 有违纪违法行为本项0分}
          - {name: 法纪观念, max: 10, tiers: {优: [8,10], 良: [6,8], 合格: [0,6]}, veto: 有违纪违法行为本项0分}
          - {name: 集体意识, max: 10, tiers: {优: [8,10], 良: [6,8], 合格: [0,6]}, embedded_adjust: '积极参加班级与团支部各项评价评优=10分；积极参加班级组织活动=8分；均无则最高不超过6分'}
          - {name: 生活修养, max: 10, tiers: {优: [8,10], 良: [6,8], 合格: [0,6]}, veto: 违反宿舍管理相关办法与规定本项0分}

      - id: deyu_jiangli
        name: 德育奖励分
        system_node: 德育加分
        items:
          - {name: 获通报表扬（校级）, score: 5, rule: 同一事件取高不累加}
          - {name: 获通报表扬（院级）, score: 3}
          - name: 宿舍获奖/卫生优秀宿舍
            type: tiered
            tiers:
              卫生优秀率≥80%（宿舍检查≥90分）: {宿舍长: 5, 成员: 4}
              卫生优秀率70%以上: {宿舍长: 3, 成员: 2}
              校级"本科生优秀宿舍": {宿舍长: 2, 成员: 1.5}
              宿舍文明风尚奖（院级）: {每人: 0.5}
              其他经认定的宿舍奖项（院级）: {每人: 0.5}
            evidence: [宿舍检查情况由辅导员提供]
          - {name: 军训先进个人（训练标兵/宣传标兵/优秀学员）, score: 2, rule: 多项荣誉取高不累加}
          - {name: 无偿献血, score: 3, unit: 分/次, evidence: [相关证明]}
          - {name: 骨髓捐赠, score: 6, unit: 分/次, evidence: [相关证明]}   # 注意：比献血高
          - name: 集体荣誉称号
            score_by_level: {院级: 1, 校级: 2, 市级及以上: 3}
            rule: 同类荣誉取高不累加
            examples: [北京市先进班集体, 示范班集体, 首都先锋杯优秀团支部, 双优班集体, 特色班集体, 红色1+1, 优秀党支部]
            route_to: 系统其他项        # 细则第8条：6-10项系统内没有，计入"其他"
          - {name: 其他个人获奖（市级及以上）, score: 6, note: 其他模块不涉及且与德育相关的奖项；同一荣誉取高不累加, route_to: 系统其他项}
          - {name: 其他个人获奖（校级）, score: 3, route_to: 系统其他项}
          - {name: 其他个人获奖（院级）, score: 1, route_to: 系统其他项}
          - {name: 参加班会和学院组织的活动, score: 0.5, unit: 分/次, evidence: [班长和活动负责人记录], route_to: 系统其他项}
          - {name: 参与班级评奖评优材料整理与汇报, score: 1, unit: 分/次, evidence: [班长或团支书记录], route_to: 系统其他项}
        route_note: 第6-10项（集体荣誉、其他个人获奖、班会活动等）系统内没有对应节点，得分累加计入系统"其他"，并在得分说明中详细说明
        class_customization: 各班可与辅导员研究决定增加其他事项，但同年级班级须协商一致

      - id: deyu_chufa
        name: 德育处罚分
        system_node: 德育减分
        note: 问卷仅提示不采集
        items:
          - {name: 怂恿或煽动他人违纪, score: -3, unit: 分/次}
          - {name: 受通报批评或公开批评, score: -3, unit: 分/次}
          - {name: 受违纪处分, tiers: {警告: -5, 严重警告: -10, 记过: -15, 留校察看: -20, 考试作弊: -20}, system_conflict: 系统只能减5分，冲突部分在"其他"项输入并标注}
          - {name: 参与非法组织活动, score: -3, unit: 分/次}
          - {name: 散播不良言论/污蔑诽谤他人, score: -2, unit: 分/次}
          - {name: 违背学术道德剽窃成果, score: -8, unit: 分/次}
          - {name: 未按时返校注册（无故未到/未请假）, score: -5, unit: 分/次, note: 买不到车票、参加非学校组织活动不能作为请假理由；由辅导员提供材料, route_to: 系统其他项}
          - {name: 无故缺席班会及学院活动, score: -2, unit: 分/次, evidence: [班会负责人签到记录], route_to: 系统其他项}
          - {name: 晚归（过宵禁）, score: -0.5, unit: 分/次, note: 以学校后勤名单为准（2019年9月后施行）, route_to: 系统其他项}
          - {name: 一票否决, note: 给学校学院声誉造成严重不良影响或违反国家法律，德育按0分计算, severity: veto, route_to: 系统其他项}
        route_note: 第7-10项系统内无法减分，计入系统"其他"，在减分说明中标注

  # =========================================================================
  # 智育（满分100 = 学习成绩×90% + 人文素质×10%）
  # =========================================================================
  - id: zhiyu
    name: 智育评价
    max_score: 100
    formula: 学习成绩×0.9 + 人文素质培养情况×0.1
    sections:
      - id: zhiyu_chengji
        name: 学习成绩
        items:
          - {name: 学分加权平均分, type: external_input, formula: Σ(成绩×学分)÷Σ学分（不含任选课）, evidence: [辅导员提供]}
      - id: zhiyu_renwu
        name: 人文素质培养情况（100分）
        uniform_all: 100    # [特点1] "难以监督和评价，为确保公平，所有学生统一打100分"
        note: 引擎直接给默认值100；细则中的通识课/读书分项仅为形式性条目
        formal_items:
          - {name: 通识课程选修（60分）, tiers: {不少于两个组类: 40, 每多一类: '+10', 上限: 60}}
          - {name: 书籍阅读（40分）, items: [阅读习惯+20, 学科覆盖+10, 读书活动+10]}

  # =========================================================================
  # 体质健康与锻炼（满分100）
  # =========================================================================
  - id: tiyu
    name: 体质健康与锻炼
    max_score: 100
    sections:
      - id: richang_duanlian
        name: 日常体育锻炼（40分）
        uniform_all: 40    # 全员统一40分
      - id: tizhi_ceshi
        name: 体质与健康测试
        items:
          - {name: 体测成绩, type: tiered, unit: 分/学年, tiers: {良好（80分）及以上: 15, 合格: 10}, evidence: [学生本人务必提交成绩证明材料], special: 港澳台学生不参加体测，按"良好"等级}
      - id: tiyu_jiben
        name: 体育活动基本分（20分）
        uniform_all: 20    # 全员统一20分
      - id: tiyu_jingsai
        name: 体育赛事加分
        matrix:
          国家级:   {参加: 10, 获奖: [8, 10]}
          省部级:   {参加: 8,  获奖: [6, 8]}
          市地区级: {参加: 6,  获奖: [6, 8]}
          校级:     {参加: 5,  获奖: [3, 5]}
          院级:     {参加: 4,  获奖: [2, 4]}
        award_rank_map: {一等奖: 区间上限, 二等奖: 区间中值, 三等奖: 区间下限, 优秀奖: 三等奖-1, 参与奖: 不算获奖只得参加分}
        rule: 同类比赛取高不累加

  # =========================================================================
  # 学术科研与创新（满分200）
  # =========================================================================
  - id: xueshu
    name: 学术科研与创新
    max_score: 200
    sections:
      - id: xueshu_jiben
        name: 基本分（50分）
        uniform_all: 50    # 全员统一50分
      - id: xueke_jingsai
        name: 学科竞赛
        matrix:
          国家级:   {参加: 15, 获奖: [15, 17]}
          省部级:   {参加: 12, 获奖: [13, 15]}
          市地区级: {参加: 10, 获奖: [10, 12]}
          校级:     {参加: 8,  获奖: [8, 10]}
          院级:     {参加: 6,  获奖: [6, 8]}
        level_determination: 参照教务处《大创系统学科竞赛收录汇总表》；不在目录中的参考承办单位级别+证书落款公章，经年级评议小组讨论形成《活动等级评议表》，最终学院领导小组判定
        team_rule:
          type: derived
          rule: 团体获奖——负责人按等级计分，其他成员少加1分（不满足系统下限计入"其他"并说明）；团体未获奖——负责人和成员同等加分
        rules: [所有比赛需提供参赛或获奖证明, 获奖分在区间内按等级区别, 不同竞赛获奖可累计, 同一竞赛不同等级取高不累加]
      - id: keyan_xiangmu
        name: 科研与创新创业项目
        matrix:
          参加: {国家级: 15, 省部级: 12, 市地区级: 10, 校级: 8, 院级: 6}
          立项: {国家级: 17, 省部级: 15, 市地区级: 12, 校级: 10, 院级: 8}   # 在参加基础上累加
          结项: {国家级: 15, 省部级: 12, 市地区级: 10, 校级: 8, 院级: 6}
        rules:
          - 只参加没有立项成功的，不论任何级别只加6分
          - 参与教师/科研机构科研项目：由教师或机构出具加盖公章证明，按公章落款单位对应级别加参加分
          - 负责人按等级计分，其他成员少加1分（不满足系统下限计入"其他"并说明）
          - 参加学术人才培养计划、绿金院科研助理团队等但未形成成果或未实际参与的，不加分
      - id: fabiao_wenzhang
        name: 发表学术文章
        exclusions: [摘抄, 新闻简讯]
        matrix:
          公开出版学术著作:        [30, 25, 20, 15]
          SCI_SSCI_EI_ISTP检索期刊: [30, 25, 20, 15]
          国内核心期刊:           [20, 16, 14, 10]
          公开发行的学术刊物:      [15, 13, 10, 8]
          公开出版的学术论文集:     [12, 10, 8, 6]
          校内学术刊物:           [8, 6, 4, 2]
        extra:
          - {name: 文章入选学术会议及论坛, score: [10, 15], unit: 分/篇}
        rules: [出版不同著作可累计, 不同论文按篇数累计, 需出版刊物或录用证明及发表材料]
      - id: xueshu_rongyu
        name: 学术科研与创新类荣誉称号
        items:
          - {name: 先进个人、十杰等, score_by_level: {院级: 8, 校级: 9, 市级: 10}}

  # =========================================================================
  # 组织管理能力（满分100）
  # =========================================================================
  - id: zuzhi
    name: 组织管理能力
    max_score: 100
    sections:
      - id: zuzhi_jiben
        name: 基本分（20分）
        tiers:
          在班级/学院/学校担任职务: 20
          不担任任何职务: 0          # ⚠️ 注意：国贸不任职为0分（财税是15分）
        exclusions: [社团任职一律不加分]
        items:
          - {name: 责任感与组织任务承担, score: 10, type: base}
          - {name: 活动策划组织协调, score: 5, type: base}
          - {name: 勤勉履职, score: 5, type: base}
      - id: zuzhi_yeji
        name: 业绩能力分（70分）
        type: external_input
        note: 由校团委、院团委书记、辅导员及其他管理部门提供分数，结果需加盖公章，个人在系统中加分，评议小组核分；工作一学期得分减半
      - id: zuzhi_jiafen
        name: 加分
        rule: 荣誉称号同类事项取高不累加
        items:
          - {name: 国家级优秀学生干部, score: 15}
          - {name: 省部级优秀学生干部, score: 12}
          - {name: 校十佳学生干部, score: 8}
          - {name: 校优秀学生干部, score: 5}
          - {name: 院级优秀学生干部, score: 3}
      - id: zuzhi_jianfen
        name: 减分
        note: 工作不认真或失误由相关部门裁定（问卷不采集）

  # =========================================================================
  # 劳动实践评价（满分100）
  # =========================================================================
  - id: laodong
    name: 劳动实践评价
    max_score: 100
    sections:
      - id: laodong_jiben
        name: 基本分（40分，4×10）
        items:
          - {name: 劳动观念与劳动教育课程, type: base, score: 10, uniform_all: true, note: 本条所有人+10}
          - {name: 社会实践与调查报告, type: base, score: 10, requirement: 必须是评价学年参与的社会实践（含寒假/暑期社会实践，自行组队自定课题经立项），需提供证明材料}
          - {name: 志愿服务与公益意识, type: base, score: 10}
          - {name: 实习实践/创业项目, type: base, score: 10, requirement: 非学校安排的实习且累计两周以上+单位实习证明；或导师指导下创业实践+导师证明}
      - id: laodong_jiafen
        name: 加分
        items:
          - name: 志愿服务时长
            rate: 0.2分/小时
            hour_conversion: {校内小时: 1.0, 院内小时: 0.5}   # [特点3] 校内直接加，院内折半
            cap: 10
            evidence: [校团委和学院团委认证，学院团委提供学生小时数（校级+院级）]
          - {name: 志愿服务社会公益荣誉称号, score: [3, 5], rule: 同类取高不累加}
          - {name: 社会实践报告/调查报告获奖, score_range_by_level: {国家级: [20,22], 省部级: [18,20], 市区级: [16,18], 校级: [12,16], 院级: [8,12]}}
          - {name: 社会实践团队立项, score_range_by_level: {负责人: {国家级: [20,22], 省部级: [16,18], 市区级: [14,16], 校级: [10,14], 院级: [8,10]}, 成员: {国家级: [16,18], 省部级: [12,14], 市区级: [10,12], 校级: [8,12], 院级: [6,8]}}}
          - {name: 社会实践团队获奖, score_range_by_level: {负责人: {国家级: [20,22], 省部级: [16,18], 市区级: [14,16], 校级: [10,14], 院级: [8,10]}, 成员: {国家级: [16,18], 省部级: [12,14], 市区级: [10,12], 校级: [8,12], 院级: [6,8]}}}
          - {name: 实习实践受服务单位表彰, score: 10, note: 须纸质表彰证明并加盖单位公章；实习证明中"表扬""优秀"等表述不属于单位表彰；只限课余自行参与的实习}
          - {name: 创业实践项目获立项资助, score_by_level: {国家级: 22, 省部级: 18, 市区级: 16, 校级: 12, 院级: 10}}
          - {name: 先进个人、十杰等, score_by_level: {国家级: 12, 省部级: 10, 市区级: 8, 校级: 6, 院级: 4}}
        rules: [同一项目多项奖励取高不累加, 难以界定等级的实践活动提交学院领导小组讨论]

  # =========================================================================
  # 美育素养评价（满分100）
  # =========================================================================
  - id: meiyu
    name: 美育素养评价
    max_score: 100
    sections:
      - id: meiyu_jiben
        name: 基本分（30分）
        uniform_all: 30    # 全员统一30分
      - id: meiyu_jingsai
        name: 文化、艺术类竞赛
        matrix:
          国家级:   {参加: 20, 获奖: [15, 20]}
